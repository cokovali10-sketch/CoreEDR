[package]
name = "coreedr"
version = "0.2.0"
edition = "2021"
authors = ["Hermes Studio"]
description = "Production-grade EDR/Antivirus engine with real-time monitoring, heuristic analysis, YARA, ML, and threat containment"
license = "MIT"

[dependencies]
# Core
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web API (Phase 11)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }

# Encryption (Phase 7)
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }

# YARA (Phase 6)
yara-x = { version = "0.14", optional = true }

# ML (Phase 9)
linfa = { version = "0.8", optional = true }
linfa-bayes = { version = "0.8", optional = true }
ndarray = { version = "0.16", optional = true }

# Storage (Phase 7)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Embedding (Phase 12)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Config hot-reload
notify = { version = "7", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_ToolHelp32",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
] }
windows-service = { version = "0.8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]

[dev-dependencies]
tempfile = "3"

[features]
default = ["full"]
full = ["api", "yara", "ml", "quarantine-encrypt", "file-monitoring", "network-monitoring", "behavioral-analysis", "config-watch", "auto-update", "web-ui", "service"]

api = ["dep:axum", "dep:tower", "dep:tower-http"]
yara = ["dep:yara-x"]
ml = ["dep:linfa", "dep:linfa-bayes", "dep:ndarray", "dep:rand"]
quarantine-encrypt = ["dep:aes-gcm", "dep:argon2", "dep:rand", "dep:rusqlite"]
file-monitoring = ["dep:notify"]
network-monitoring = []
behavioral-analysis = []
config-watch = ["dep:notify"]
auto-update = []
web-ui = ["dep:rust-embed", "dep:mime_guess"]
service = ["dep:windows-service"]

[[bin]]
name = "coreedr"
path = "src/main.rs"
