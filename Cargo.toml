[package]
name = "coreedr"
version = "0.1.0"
edition = "2021"
authors = ["Hermes Studio"]
description = "Lightweight EDR/Antivirus engine with real-time process monitoring, heuristic analysis, and threat containment"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
notify = "7"
regex = "1"
walkdir = "2"
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winnt", "processthreadsapi", "handleapi", "securitybaseapi", "winbase"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "coreedr"
path = "src/main.rs"
